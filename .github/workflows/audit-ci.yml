name: Audit CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: audit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: turkceokulunew
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -ptestpass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          path: web

      - name: Checkout API
        uses: actions/checkout@v4
        with:
          repository: fgulen/api
          token: ${{ secrets.GH_PAT }}
          path: api

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Web lint
        id: lint
        run: |
          npx eslint . --max-warnings=0 2>&1 | tee ../audit-lint.txt
          exit ${PIPESTATUS[0]}
        working-directory: web
        continue-on-error: true

      - name: Web type check
        id: typecheck
        run: |
          npx tsc --noEmit 2>&1 | tee ../audit-typecheck.txt
          exit ${PIPESTATUS[0]}
        working-directory: web
        continue-on-error: true

      - name: Web build (production)
        id: build
        run: |
          NEXT_PUBLIC_API_URL=http://localhost:5221 \
          NEXT_PUBLIC_R2_URL=http://localhost:5221 \
          npm run build 2>&1 | tee ../audit-build.txt
        working-directory: web
        continue-on-error: true

      - name: npm audit
        id: npmaudit
        run: |
          npm audit --audit-level=high 2>&1 | tee ../audit-npm.txt
          exit ${PIPESTATUS[0]}
        working-directory: web
        continue-on-error: true

      - name: Build API
        id: apibuild
        run: dotnet build --configuration Release 2>&1 | tee ../audit-apibuild.txt
        working-directory: api
        continue-on-error: true

      - name: Restore & build API tests
        run: dotnet restore && dotnet build --configuration Release 2>&1 | tee ../../audit-apitestbuild.txt
        working-directory: api/TurkceOkulu.Api.Tests
        continue-on-error: true

      - name: Run API unit tests
        id: apitests
        run: |
          dotnet test --configuration Release --no-build \
            --logger "trx;LogFileName=../audit-apitester.Results.xml" 2>&1 | tee ../../audit-apitester.txt
          # exit code yakala — test basarisiz olsa bile devam
        working-directory: api/TurkceOkulu.Api.Tests
        continue-on-error: true

      - name: NuGet audit
        id: nugetaudit
        run: |
          dotnet list package --vulnerable 2>&1 | tee ../audit-nuget.txt
        working-directory: api
        continue-on-error: true

      - name: Reset CI database
        run: |
          # 2026-07-31 gozlemi: ayni "mysql:8.0" servisi ard arda workflow_dispatch
          # kosularinda BEKLENMEDIK sekilde onceki turdan __EFMigrationsHistory
          # kaydini tasiyor gibi davrandi (iki ayri fresh-run denemesinde de "Applying
          # migration" satiri hic basilmadi, sanki her sey zaten migrate edilmisti) —
          # halbuki lokal denemede (DROP+CREATE DATABASE ile garantili bos sema)
          # tum 42 migration sorunsuz uygulandi. Kok nedeni GH Actions runner/servis
          # tarafinda netlesmedi; CI'yi guvenilir kilmak icin sema burada acikca
          # sifirlaniyor — hangi nedenle olursa olsun bir sonraki adim garanti bos
          # bir veritabaniyla basliyor.
          mysql -h127.0.0.1 -P3306 -uroot -ptestpass -e "DROP DATABASE IF EXISTS turkceokulunew; CREATE DATABASE turkceokulunew CHARACTER SET utf8mb4;"

      - name: Start API
        env:
          # Onceki "Setup API secrets" adimi dotnet user-secrets kullaniyordu — ama
          # WebApplication.CreateBuilder user-secrets'i SADECE Development ortaminda
          # otomatik yukler, bu adim ASPNETCORE_ENVIRONMENT=Production calistiriyor,
          # yani hicbiri hic okunmuyordu. USTUNE, anahtar adlari da appsettings.json'daki
          # gercek yapiyla uyusmuyordu (ConnectionStrings:DefaultConnection yerine
          # ConnectionStrings:Default, AppSettings:AnthropicApiKey yerine Anthropic:ApiKey
          # vb.) — Jwt:Secret hicbir zaman set edilmemis, appsettings.json'daki 23
          # karakterlik CHANGE_ME_MIN_32_CHARS placeholder'i kaliyor, Program.cs'in
          # kendi 32-karakter guvenlik kontrolune takilip API'nin acilista crash
          # olmasina yol aciyordu (once "API health: 000" olarak gorulmustu, log
          # gorunurlugu eklenince gercek "Jwt:Secret en az 32 karakter olmali" hatasi
          # cikti). Ortam degiskenleri (__ = section ayraci) her ortamda okunur,
          # anahtar adlari appsettings.json ile birebir.
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://localhost:5221
          ConnectionStrings__Default: "Server=localhost;Port=3306;Database=turkceokulunew;Uid=root;Pwd=testpass;CharSet=utf8mb4;"
          Jwt__Secret: "test-jwt-key-for-ci-at-least-32-chars!!"
          Jwt__Issuer: "TurkceOkulu"
          Jwt__Audience: "TurkceOkulu"
          Anthropic__ApiKey: "sk-test-fake"
          DeepL__ApiKey: "fake-deepL-key"
          Resend__ApiKey: "re_test_fake"
        run: |
          # nohup+disown: adim biterken shell'in kapanmasi arka plandaki dotnet
          # process'ini SIGHUP ile oldurmesin diye (klasik CI arka-plan-surec tuzagi).
          nohup dotnet run --configuration Release > /tmp/api-run.log 2>&1 &
          disown

          # Sabit sleep yerine poll: migration+seed her CI'da sifirdan calisiyor,
          # tek denemelik 15sn her zaman yetmeyebilir. 60sn'ye kadar 3sn araliklarla dene,
          # basarisiz olursa dotnet'in kendi log'unu bas (gercek hatayi gormek icin).
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5221/health || true)
            if [ "$code" = "200" ]; then
              echo "API health: $code (deneme $i/20)"
              exit 0
            fi
            sleep 3
          done
          echo "API 60sn icinde ayaga kalkmadi. dotnet run cikti (son 100 satir):"
          tail -100 /tmp/api-run.log
          exit 1
        working-directory: api
        continue-on-error: true

      - name: Start web preview
        run: |
          npm run build
          nohup npm run start > /tmp/web-start.log 2>&1 &
          disown

          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || true)
            if [ "$code" = "200" ]; then
              echo "Web preview: $code (deneme $i/15)"
              exit 0
            fi
            sleep 2
          done
          echo "Web preview 30sn icinde ayaga kalkmadi. npm start cikti (son 100 satir):"
          tail -100 /tmp/web-start.log
          exit 1
        working-directory: web
        continue-on-error: true

      - name: Run Playwright audit tests
        id: playwright
        run: |
          npx playwright test e2e/security.spec.ts e2e/rate-limiting.spec.ts \
            e2e/test-unitesi-a11y.spec.ts 2>&1 | tee ../audit-playwright.txt
        working-directory: web
        continue-on-error: true

      - name: Lighthouse CI
        id: lighthouse
        run: |
          npx lhci autorun --config=lighthouserc.json 2>&1 | tee ../audit-lighthouse.txt || true
        working-directory: web
        continue-on-error: true

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p audit-artifacts
          for f in audit-*.txt; do
            [ -f "$f" ] && cp "$f" audit-artifacts/
          done
          # Lighthouse raporu
          cp -r web/.lighthouseci audit-artifacts/ 2>/dev/null || true
          # Test raporlari
          cp web/test-results/a11y-bulgular.json audit-artifacts/ 2>/dev/null || true
          cp web/test-results audit-artifacts/ --recursive 2>/dev/null || true
          # API/web arka plan surec loglari — sunucu tarafi hatalarini gormeden
          # Playwright'in "500 döndü" gibi client-gorunumlu hatalarini debug etmek
          # imkansizdi (bkz. madde 60 register-500 arastirmasi).
          cp /tmp/api-run.log audit-artifacts/ 2>/dev/null || true
          cp /tmp/web-start.log audit-artifacts/ 2>/dev/null || true

      - name: Generate audit score
        id: score
        shell: pwsh
        run: |
          $env:CI = "true"
          & "web/scripts/audit-ci.ps1" -ReportPath "audit-artifacts/audit-raporu.json"
        continue-on-error: true

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-artifacts/
          retention-days: 30
